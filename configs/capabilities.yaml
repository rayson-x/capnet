# cap-node 能力配置表:默认扩展路径 —— 在这里加条目即可注册新能力(零 Go 代码)
# exec 里的 {field} 会被任务 payload[field] 替换,stdout 作为结果(合法 JSON 原样返回)
node_id: cloud-gpu
node_label: cloud-developer

capabilities:
  # hello world:验证配置表驱动的能力能否被调用并返回结果
  - name: hello
    version: "1.0.0"
    schema: '{"type":"object","properties":{"who":{"type":"string"}},"required":["who"]}'
    needs_gpu: false
    exec: "echo hello-{who}"

  - name: stt
    version: "1.0.0"
    schema: '{"type":"object","properties":{"audio":{"type":"string"},"lang":{"enum":["zh","en"]}},"required":["audio"]}'
    needs_gpu: true
    exec: "echo fake-stt:[{audio}]"

  - name: ocr
    version: "1.0.0"
    schema: '{"type":"object","properties":{"image":{"type":"string"}},"required":["image"]}'
    needs_gpu: true
    exec: "echo fake-ocr:[{image}]"

  # 真实示例(等你有模型镜像):exec 换成跑容器的命令即可
  # - name: real_stt
  #   exec: "docker run --rm --gpus all unseal/whisper {audio}"
